<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Midnight Vignette -->
    <radialGradient id="ogVignette" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#182A42"/>
      <stop offset="100%" stop-color="#0A121E"/>
    </radialGradient>

    <!-- Antique Gold Gradient -->
    <linearGradient id="ogGoldMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6"/>
      <stop offset="25%" stop-color="#E5C88F"/>
      <stop offset="65%" stop-color="#C7A56A"/>
      <stop offset="100%" stop-color="#8F6A27"/>
    </linearGradient>

    <linearGradient id="ogGoldDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#73521C"/>
      <stop offset="50%" stop-color="#A88139"/>
      <stop offset="100%" stop-color="#DFBF7E"/>
    </linearGradient>

    <filter id="ogShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#ogVignette)"/>

  <!-- Outer Double Fine Gold Frame -->
  <rect x="36" y="36" width="1128" height="558" rx="4" stroke="#C7A56A" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="48" y="48" width="1104" height="534" rx="2" stroke="#C7A56A" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Left Side: Professional Minimalist Serif Monogram 'RLA' Crest -->
  <g transform="translate(130, 140)" filter="url(#ogShadow)">
    <!-- Dual Hairline Concentric Circles -->
    <circle cx="175" cy="175" r="165" fill="#101C2C" stroke="url(#ogGoldMain)" stroke-width="3.5"/>
    <circle cx="175" cy="175" r="154" stroke="url(#ogGoldMain)" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Accent Cardinal Diamonds -->
    <polygon points="175,18 179,24 175,30 171,24" fill="url(#ogGoldMain)"/>
    <polygon points="175,320 179,326 175,332 171,326" fill="url(#ogGoldMain)"/>
    <polygon points="18,175 24,179 30,175 24,171" fill="url(#ogGoldMain)"/>
    <polygon points="320,175 326,179 332,175 326,171" fill="url(#ogGoldMain)"/>

    <!-- Scaled Monogram: R - L - A -->
    <g transform="translate(15, 15) scale(2.0)">
      <!-- Letter 'R' -->
      <path d="M 36 44 L 54 44 L 54 48 L 47 48 L 47 110 L 54 110 L 54 114 L 36 114 L 36 110 L 43 110 L 43 48 L 36 48 Z" fill="url(#ogGoldMain)"/>
      <path d="M 47 45 L 68 45 C 80 45 88 51 88 62 C 88 73 80 80 67 80 L 47 80 Z M 47 50 L 47 75 L 66 75 C 75 75 82 70 82 62 C 82 54 75 50 66 50 Z" fill="url(#ogGoldMain)"/>
      <path d="M 64 78 L 84 109 C 87 113 91 114 96 114 L 96 110 C 92 110 88 108 85 104 L 67 77 Z" fill="url(#ogGoldDark)"/>

      <!-- Letter 'A' -->
      <path d="M 98 44 L 105 44 L 86 114 L 79 114 Z" fill="url(#ogGoldDark)" opacity="0.85"/>
      <path d="M 103 44 L 110 44 L 128 110 L 135 110 L 135 114 L 117 114 L 117 110 L 123 110 L 113 75 L 89 75 L 87 81 L 97 81 L 96 85 L 85 85 L 83 91 L 101 91 Z" fill="url(#ogGoldMain)"/>
      <path d="M 97 43 L 111 43 L 108 47 L 100 47 Z" fill="url(#ogGoldMain)"/>

      <!-- Letter 'L' -->
      <path d="M 52 111 L 108 111 C 114 111 118 108 120 102 L 123 102 L 121 115 L 48 115 L 48 111 Z" fill="url(#ogGoldMain)"/>

      <!-- Scale Pivot Dot -->
      <circle cx="80" cy="41" r="2.5" fill="url(#ogGoldMain)"/>
      <line x1="68" y1="41" x2="92" y2="41" stroke="url(#ogGoldMain)" stroke-width="0.75"/>
    </g>
  </g>

  <!-- Right Side: Official Brand Typography Lockup -->
  <g transform="translate(540, 165)">
    <!-- Motto Kicker -->
    <text x="0" y="24" fill="#C7A56A" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="4">
      YOUR RIGHTS · OUR PRIORITY
    </text>

    <!-- Main Wordmark: RAUT -->
    <text x="0" y="112" fill="#FFFFFF" font-family="'Georgia', serif" font-weight="bold" font-size="76" letter-spacing="6">
      RAUT
    </text>

    <!-- LEGAL ASSOCIATES -->
    <text x="4" y="160" fill="#C7A56A" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="600" letter-spacing="8">
      LEGAL ASSOCIATES
    </text>

    <!-- Core Practice Strip -->
    <g transform="translate(4, 205)">
      <text x="0" y="0" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="500" letter-spacing="3">
        CORPORATE &nbsp;|&nbsp; CIVIL &nbsp;|&nbsp; CRIMINAL &nbsp;|&nbsp; ADVISORY
      </text>
    </g>

    <!-- Fine Hairline Divider -->
    <line x1="4" y1="235" x2="580" y2="235" stroke="#223A5C" stroke-width="1.5"/>

    <!-- Chamber Details -->
    <g transform="translate(4, 275)">
      <text x="0" y="0" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" letter-spacing="1">LOCATION</text>
      <text x="0" y="24" fill="#F7F5F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600">Basundhara-5, Tokha, Kathmandu, Nepal</text>

      <text x="340" y="0" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" letter-spacing="1">CONSULTATION</text>
      <text x="340" y="24" fill="#C7A56A" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold">NPR 500 Evaluation</text>
    </g>
  </g>
</svg>
