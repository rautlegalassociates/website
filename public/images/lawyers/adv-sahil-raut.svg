<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="chamberGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3A2C21" />
      <stop offset="50%" stop-color="#1A1512" />
      <stop offset="100%" stop-color="#0B0907" />
    </radialGradient>

    <linearGradient id="bookshelfWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D1F16" />
      <stop offset="50%" stop-color="#3F2B1F" />
      <stop offset="100%" stop-color="#221710" />
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DEB0" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA822A" />
      <stop offset="100%" stop-color="#7B5B16" />
    </linearGradient>

    <linearGradient id="bronzeStatue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C185" />
      <stop offset="40%" stop-color="#B88A44" />
      <stop offset="80%" stop-color="#7A5623" />
      <stop offset="100%" stop-color="#4E3312" />
    </linearGradient>

    <!-- Mahogany Desk Gradient -->
    <linearGradient id="mahoganyDesk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A2718" />
      <stop offset="30%" stop-color="#321A10" />
      <stop offset="70%" stop-color="#231109" />
      <stop offset="100%" stop-color="#130804" />
    </linearGradient>

    <!-- Suit & Velvet Gradients -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B2D31" />
      <stop offset="40%" stop-color="#18191C" />
      <stop offset="100%" stop-color="#0E0F12" />
    </linearGradient>

    <linearGradient id="skinTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECC4A0" />
      <stop offset="50%" stop-color="#D9A87E" />
      <stop offset="100%" stop-color="#BE875D" />
    </linearGradient>

    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2B2421" />
      <stop offset="60%" stop-color="#151210" />
      <stop offset="100%" stop-color="#080706" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="deskShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>
    <filter id="statueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#D4AF37" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- BACKGROUND: Law Library Chamber -->
  <rect width="800" height="800" fill="url(#chamberGlow)" />

  <!-- Wall Panel & Bookshelf (Right Side) -->
  <rect x="580" y="0" width="220" height="580" fill="url(#bookshelfWood)" />
  <rect x="575" y="0" width="8" height="580" fill="#1A110B" />

  <!-- Bookshelf Shelves -->
  <g fill="#21150D" stroke="#140C07" stroke-width="2">
    <rect x="580" y="80" width="220" height="12" />
    <rect x="580" y="210" width="220" height="12" />
    <rect x="580" y="340" width="220" height="12" />
    <rect x="580" y="470" width="220" height="12" />
  </g>

  <!-- Books on Shelves (Row 1) -->
  <g opacity="0.85">
    <rect x="590" y="14" width="16" height="66" fill="#801818" rx="1" />
    <rect x="608" y="10" width="18" height="70" fill="#1C355E" rx="1" />
    <rect x="628" y="16" width="15" height="64" fill="#3D2B1F" rx="1" />
    <rect x="645" y="12" width="20" height="68" fill="#801818" rx="1" />
    <rect x="667" y="14" width="17" height="66" fill="#2E4A35" rx="1" />
    <rect x="686" y="10" width="19" height="70" fill="#8C6D2B" rx="1" />
    <rect x="707" y="15" width="16" height="65" fill="#1C355E" rx="1" />
    <rect x="725" y="12" width="22" height="68" fill="#801818" rx="1" />
    <rect x="749" y="14" width="17" height="66" fill="#3D2B1F" rx="1" />
    <rect x="768" y="10" width="24" height="70" fill="#1C355E" rx="1" />
  </g>

  <!-- Books on Shelves (Row 2) -->
  <g opacity="0.85">
    <rect x="590" y="98" width="22" height="112" fill="#8C6D2B" rx="1" />
    <rect x="614" y="94" width="19" height="116" fill="#801818" rx="1" />
    <rect x="635" y="100" width="16" height="110" fill="#1C355E" rx="1" />
    <rect x="653" y="96" width="24" height="114" fill="#3D2B1F" rx="1" />
    <rect x="679" y="94" width="18" height="116" fill="#801818" rx="1" />
    <rect x="699" y="98" width="22" height="112" fill="#2E4A35" rx="1" />
    <rect x="723" y="95" width="20" height="115" fill="#8C6D2B" rx="1" />
    <rect x="745" y="98" width="17" height="112" fill="#1C355E" rx="1" />
    <rect x="764" y="94" width="28" height="116" fill="#801818" rx="1" />
  </g>

  <!-- Books on Shelves (Row 3) -->
  <g opacity="0.85">
    <rect x="590" y="228" width="20" height="112" fill="#801818" rx="1" />
    <rect x="612" y="225" width="24" height="115" fill="#1C355E" rx="1" />
    <rect x="638" y="230" width="18" height="110" fill="#8C6D2B" rx="1" />
    <rect x="658" y="226" width="22" height="114" fill="#3D2B1F" rx="1" />
    <rect x="682" y="224" width="25" height="116" fill="#801818" rx="1" />
    <rect x="709" y="228" width="19" height="112" fill="#1C355E" rx="1" />
    <rect x="730" y="225" width="23" height="115" fill="#2E4A35" rx="1" />
    <rect x="755" y="227" width="20" height="113" fill="#8C6D2B" rx="1" />
    <rect x="777" y="224" width="20" height="116" fill="#801818" rx="1" />
  </g>

  <!-- Framed Scales of Justice on Left Wall -->
  <g transform="translate(10, 60)" opacity="0.85">
    <rect x="0" y="0" width="190" height="180" fill="#221A15" stroke="url(#goldSheen)" stroke-width="5" rx="3" />
    <rect x="10" y="10" width="170" height="160" fill="#15100D" />
    <!-- Golden Scales -->
    <path d="M95,30 L95,140 M60,140 L130,140" stroke="url(#goldSheen)" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M45,55 L145,55" stroke="url(#goldSheen)" stroke-width="4" stroke-linecap="round" />
    <circle cx="95" cy="55" r="5" fill="url(#goldSheen)" />
    <!-- Left Pan -->
    <path d="M45,55 L30,95 M45,55 L60,95" stroke="url(#goldSheen)" stroke-width="1.8" />
    <path d="M25,95 Q45,108 65,95 Z" fill="url(#goldSheen)" />
    <!-- Right Pan -->
    <path d="M145,55 L130,95 M145,55 L160,95" stroke="url(#goldSheen)" stroke-width="1.8" />
    <path d="M125,95 Q145,108 165,95 Z" fill="url(#goldSheen)" />
  </g>

  <!-- Potted Orchid Plant (Left Background) -->
  <g transform="translate(0, 370)" opacity="0.7">
    <ellipse cx="30" cy="80" rx="24" ry="12" fill="#E8E4DC" />
    <path d="M10,80 L20,130 L40,130 L50,80 Z" fill="#D9D4C7" />
    <path d="M30,80 Q25,30 40,0" stroke="#3A5335" stroke-width="3" fill="none" />
    <circle cx="40" cy="5" r="7" fill="#F8F6F0" />
    <circle cx="28" cy="25" r="6" fill="#F8F6F0" />
  </g>

  <!-- HIGH EXECUTIVE CHAIR -->
  <g>
    <!-- Chair Headrest & Tufted Back -->
    <rect x="110" y="300" width="460" height="280" rx="45" fill="#111317" stroke="#0A0B0E" stroke-width="4" />
    <!-- Leather Highlight Curve -->
    <path d="M140,320 Q340,305 540,320" stroke="#2D3038" stroke-width="4" fill="none" opacity="0.4" />
  </g>

  <!-- ADVOCATE: ADV. SAHIL RAUT GADDI -->
  <g id="advocateFigure">
    <!-- Suit Body / Shoulders -->
    <path d="M140,580 L200,380 Q340,360 480,380 L540,580 Z" fill="url(#suitGrad)" />

    <!-- White Dress Shirt Collar & Placket -->
    <polygon points="305,370 340,480 375,370" fill="#FFFFFF" />
    <polygon points="280,365 315,445 320,380" fill="#EFEFEF" />
    <polygon points="400,365 365,445 360,380" fill="#DFDFDF" />

    <!-- Solid Black Necktie -->
    <polygon points="325,385 355,385 360,450 340,560 320,450" fill="#0C0D10" />
    <path d="M325,385 L355,385 L348,425 L332,425 Z" fill="#1C1D22" />

    <!-- Suit Lapels -->
    <path d="M210,385 L305,480 L315,580 L230,580 Z" fill="#1C1E23" />
    <path d="M470,385 L375,480 L365,580 L450,580 Z" fill="#16171B" />

    <!-- Neck -->
    <rect x="315" y="325" width="50" height="55" fill="url(#skinTone)" rx="5" />
    <!-- Neck shadow -->
    <path d="M315,355 Q340,375 365,355 L365,375 L315,375 Z" fill="#A86E45" opacity="0.5" />

    <!-- Head / Face -->
    <ellipse cx="340" cy="275" rx="62" ry="72" fill="url(#skinTone)" />

    <!-- Ears -->
    <ellipse cx="277" cy="275" rx="9" ry="16" fill="#D9A87E" />
    <ellipse cx="403" cy="275" rx="9" ry="16" fill="#D9A87E" />

    <!-- Trimmed Beard & Jawline -->
    <path d="M282,260 C282,325 310,355 340,355 C370,355 398,325 398,260 C395,285 385,340 340,342 C295,340 285,285 282,260 Z" fill="url(#hairGrad)" />

    <!-- Defined Mustache -->
    <path d="M316,302 Q340,300 364,302 Q352,314 340,314 Q328,314 316,302 Z" fill="#120F0D" />

    <!-- Lips -->
    <path d="M325,316 Q340,322 355,316" stroke="#9E5D47" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Nose -->
    <path d="M338,260 L342,286 L348,289 L332,289" stroke="#B87D52" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Eyes & Expressive Brows -->
    <!-- Left Eye & Brow -->
    <path d="M298,242 Q316,236 328,243" stroke="#0E0C0B" stroke-width="4.5" fill="none" stroke-linecap="round" />
    <ellipse cx="314" cy="254" rx="9" ry="5.5" fill="#FFFFFF" />
    <circle cx="315" cy="254" r="4.2" fill="#2A1B14" />
    <circle cx="316" cy="253" r="1.5" fill="#FFFFFF" />

    <!-- Right Eye & Brow -->
    <path d="M352,243 Q364,236 382,242" stroke="#0E0C0B" stroke-width="4.5" fill="none" stroke-linecap="round" />
    <ellipse cx="366" cy="254" rx="9" ry="5.5" fill="#FFFFFF" />
    <circle cx="365" cy="254" r="4.2" fill="#2A1B14" />
    <circle cx="366" cy="253" r="1.5" fill="#FFFFFF" />

    <!-- Styled Textured Dark Hair (Pompadour / Fade) -->
    <path d="M276,250 C270,185 300,145 340,140 C380,145 410,185 404,250 C398,220 380,195 340,195 C300,195 282,220 276,250 Z" fill="url(#hairGrad)" />
    <!-- Textured hair volume on top -->
    <path d="M288,180 C295,145 325,130 350,132 C375,134 395,150 400,180 C390,160 365,150 340,152 C315,154 298,165 288,180 Z" fill="#2D231E" />
  </g>

  <!-- FOREGROUND: EXECUTIVE MAHOGANY DESK -->
  <g id="executiveDesk" filter="url(#deskShadow)">
    <!-- Desk Top Surface -->
    <polygon points="0,550 800,550 800,800 0,800" fill="url(#mahoganyDesk)" />
    <!-- Polished Desk Edge Highlight -->
    <line x1="0" y1="550" x2="800" y2="550" stroke="#7A452E" stroke-width="3" />
    <line x1="0" y1="553" x2="800" y2="553" stroke="#25120A" stroke-width="2" />
  </g>

  <!-- CLASPED HANDS ON DESK WITH LUXURY WATCH -->
  <g id="claspedHands">
    <!-- Left Forearm & Suit Sleeve -->
    <path d="M220,570 L300,535 L330,565 L240,615 Z" fill="#18191C" />
    <!-- White Shirt Cuff -->
    <polygon points="295,532 308,527 318,548 305,553" fill="#FFFFFF" />
    <!-- Wristwatch with Leather Strap -->
    <rect x="306" y="530" width="10" height="18" rx="2" fill="#241B15" />
    <circle cx="311" cy="539" r="6.5" fill="url(#goldSheen)" stroke="#111" stroke-width="1.2" />
    <circle cx="311" cy="539" r="4.5" fill="#FFFFFF" />
    <line x1="311" y1="539" x2="311" y2="536" stroke="#111" stroke-width="1" />
    <line x1="311" y1="539" x2="313" y2="539" stroke="#111" stroke-width="1" />

    <!-- Right Forearm & Suit Sleeve -->
    <path d="M460,570 L380,535 L350,565 L440,615 Z" fill="#151619" />
    <!-- White Shirt Cuff -->
    <polygon points="385,532 372,527 362,548 375,553" fill="#FFFFFF" />

    <!-- Clasped Fingers (Dignified Pose) -->
    <g fill="url(#skinTone)" stroke="#A0673E" stroke-width="1.2">
      <!-- Intertwined fingers -->
      <ellipse cx="340" cy="550" rx="28" ry="18" fill="#D9A87E" />
      <path d="M322,542 Q340,538 358,542" />
      <path d="M320,549 Q340,545 360,549" />
      <path d="M322,556 Q340,552 358,556" />
      <path d="M325,562 Q340,558 355,562" />
    </g>
  </g>

  <!-- STACK OF 3 LAW BOOKS (Left Desk Foreground) -->
  <g transform="translate(15, 470)" filter="url(#deskShadow)">
    <!-- Book 1 (Bottom): CIVIL PROCEDURE (Navy/Charcoal with Gold Spine) -->
    <g transform="translate(0, 100)">
      <path d="M0,0 L210,0 L205,32 L0,32 Z" fill="#172230" stroke="#0D1520" stroke-width="2" />
      <line x1="0" y1="6" x2="208" y2="6" stroke="url(#goldSheen)" stroke-width="1.5" />
      <line x1="0" y1="26" x2="205" y2="26" stroke="url(#goldSheen)" stroke-width="1.5" />
      <text x="24" y="21" font-family="'Times New Roman', serif" font-weight="bold" font-size="11" fill="url(#goldSheen)" letter-spacing="2">CIVIL PROCEDURE</text>
    </g>

    <!-- Book 2 (Middle): CRIMINAL LAW (Rich Maroon with Gold Spine) -->
    <g transform="translate(0, 68)">
      <path d="M0,0 L205,0 L200,32 L0,32 Z" fill="#5E1419" stroke="#3D0B0E" stroke-width="2" />
      <line x1="0" y1="6" x2="203" y2="6" stroke="url(#goldSheen)" stroke-width="1.5" />
      <line x1="0" y1="26" x2="200" y2="26" stroke="url(#goldSheen)" stroke-width="1.5" />
      <text x="32" y="21" font-family="'Times New Roman', serif" font-weight="bold" font-size="11" fill="url(#goldSheen)" letter-spacing="2">CRIMINAL LAW</text>
    </g>

    <!-- Book 3 (Top): CONSTITUTIONAL LAW (Black Leather with Gold Spine) -->
    <g transform="translate(0, 36)">
      <path d="M0,0 L195,0 L190,32 L0,32 Z" fill="#141416" stroke="#08080A" stroke-width="2" />
      <line x1="0" y1="6" x2="193" y2="6" stroke="url(#goldSheen)" stroke-width="1.5" />
      <line x1="0" y1="26" x2="190" y2="26" stroke="url(#goldSheen)" stroke-width="1.5" />
      <text x="18" y="21" font-family="'Times New Roman', serif" font-weight="bold" font-size="10.5" fill="url(#goldSheen)" letter-spacing="1.8">CONSTITUTIONAL LAW</text>
    </g>
  </g>

  <!-- SLEEK SILVER LAPTOP (Center-Right Desk) -->
  <g transform="translate(290, 560)" opacity="0.95">
    <!-- Laptop Base -->
    <polygon points="10,25 240,25 250,38 0,38" fill="#C8CDD4" stroke="#8E959E" stroke-width="1" />
    <line x1="105" y1="36" x2="145" y2="36" stroke="#5E646E" stroke-width="2" stroke-linecap="round" />
    <!-- Laptop Lid Edge (Closed/Flat) -->
    <polygon points="15,22 235,22 240,26 10,26" fill="#E2E6EC" />
  </g>

  <!-- BRONZE LADY JUSTICE STATUE (Right Desk Foreground) -->
  <g transform="translate(560, 410)" filter="url(#statueGlow)">
    <!-- Base Pedestal -->
    <rect x="40" y="240" width="60" height="20" fill="url(#bronzeStatue)" rx="2" />
    <rect x="46" y="232" width="48" height="8" fill="#5A3D18" />

    <!-- Robed Figurine -->
    <path d="M70,70 Q78,110 82,160 Q86,200 88,232 L52,232 Q54,190 58,150 Q62,110 70,70 Z" fill="url(#bronzeStatue)" />
    <!-- Flowing Blindfold & Crown -->
    <circle cx="70" cy="58" r="10" fill="url(#bronzeStatue)" />
    <rect x="63" y="56" width="14" height="4" fill="#3D250C" rx="1" />

    <!-- Raised Left Arm holding Scales of Justice -->
    <path d="M78,82 L106,62 L108,66 L82,86 Z" fill="url(#bronzeStatue)" />
    <!-- Balance Beam -->
    <line x1="88" y1="62" x2="128" y2="62" stroke="url(#goldSheen)" stroke-width="2.5" />
    <!-- Left Scale Pan -->
    <line x1="90" y1="62" x2="85" y2="88" stroke="url(#goldSheen)" stroke-width="1.2" />
    <line x1="90" y1="62" x2="95" y2="88" stroke="url(#goldSheen)" stroke-width="1.2" />
    <path d="M82,88 Q90,96 98,88 Z" fill="url(#goldSheen)" />
    <!-- Right Scale Pan -->
    <line x1="126" y1="62" x2="121" y2="92" stroke="url(#goldSheen)" stroke-width="1.2" />
    <line x1="126" y1="62" x2="131" y2="92" stroke="url(#goldSheen)" stroke-width="1.2" />
    <path d="M118,92 Q126,100 134,92 Z" fill="url(#goldSheen)" />

    <!-- Right Arm holding Sword of Justice -->
    <path d="M62,84 L48,115 L52,118 L66,86 Z" fill="url(#bronzeStatue)" />
    <!-- Sword Blade pointed downwards -->
    <line x1="48" y1="110" x2="48" y2="200" stroke="url(#goldSheen)" stroke-width="2" />
    <line x1="42" y1="120" x2="54" y2="120" stroke="url(#goldSheen)" stroke-width="3" />
    <circle cx="48" cy="110" r="3" fill="url(#goldSheen)" />
  </g>

  <!-- Pen Holder on Right Desk -->
  <g transform="translate(680, 560)">
    <rect x="0" y="15" width="28" height="45" fill="#1C1E24" rx="2" />
    <!-- Executive Pens -->
    <line x1="8" y1="5" x2="12" y2="25" stroke="url(#goldSheen)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="18" y1="0" x2="18" y2="25" stroke="#E2E6EC" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- ELEGANT BOTTOM BRANDING BAR -->
  <rect x="0" y="740" width="800" height="60" fill="#0C1420" />
  <line x1="0" y1="740" x2="800" y2="740" stroke="url(#goldSheen)" stroke-width="2" />

  <text x="32" y="776" font-family="'Times New Roman', serif" font-weight="bold" font-size="19" fill="#F4DEAF" letter-spacing="0.5">ADV. SAHIL RAUT GADDI</text>
  <text x="300" y="775" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="12" fill="#C7A56A" letter-spacing="1.5">· ADVOCATE &amp; LEGAL COUNSEL</text>
  <text x="768" y="775" text-anchor="end" font-family="'Times New Roman', serif" font-weight="normal" font-size="13" fill="#A8B2C0" letter-spacing="1">RAUT LEGAL ASSOCIATES · KATHMANDU</text>
</svg>
